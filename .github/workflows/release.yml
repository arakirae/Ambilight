# Builds Ambilight.zip (just what's needed to install) and attaches it to a GitHub release
# every time a version tag like v1.1.0 is pushed or a release is published from the website.

name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# A tag pushed and a release published from the website start two runs: they wait for each other
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Files at the top of the ZIP, so Windows' "Extract All" gives a single Ambilight folder
      - name: Build Ambilight.zip
        run: zip Ambilight.zip Install.bat install.ps1 index.ts ambilight.ts native.ts LICENSE

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ p = (index($0, "## " v " ") == 1 || $0 == "## " v); next } p' CHANGELOG.md > notes.md
          printf '\n**How to install:** download Ambilight.zip below, extract it and double-click Install.bat. Full guide: https://github.com/%s#installation\n' "$GITHUB_REPOSITORY" >> notes.md

      # Creates the release, or fills in the one already made from the website
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Ambilight.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Ambilight ${GITHUB_REF_NAME#v}" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" Ambilight.zip --title "Ambilight ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
