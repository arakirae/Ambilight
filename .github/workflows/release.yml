# Builds Ambilight.zip (just what's needed to install) and attaches it to a GitHub release
# every time a version tag like v1.1.0 is pushed or a release is published from the website.

name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# A tag pushed and a release published from the website start two runs: they wait for each other
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag, the version in index.ts and the lists of files have to agree,
      # or the copies of the plugin that are already installed can't update themselves
      - name: Check the version and the file lists
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "const VERSION = \"$version\";" index.ts || { echo "::error::index.ts doesn't say version $version"; exit 1; }
          for file in $(jq -r '.files[]' update.json); do
            test -f "$file" || { echo "::error::update.json lists $file, which isn't in the repository"; exit 1; }
            grep -q "'$file'" install.ps1 || { echo "::error::install.ps1 doesn't install $file"; exit 1; }
          done
          for file in *.ts *.tsx *.css; do
            test -f "$file" || continue
            jq -e --arg f "$file" '.files | index($f) != null' update.json > /dev/null || { echo "::error::$file isn't listed in update.json"; exit 1; }
          done

      # Files at the top of the ZIP, so Windows' "Extract All" gives a single Ambilight folder
      - name: Build Ambilight.zip
        run: zip Ambilight.zip Install.bat install.ps1 $(jq -r '.files[]' update.json) LICENSE

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ p = (index($0, "## " v " ") == 1 || $0 == "## " v); next } p' CHANGELOG.md > notes.md
          printf '\n**How to install:** download Ambilight.zip below, extract it and double-click Install.bat. Full guide: https://github.com/%s#installation\n' "$GITHUB_REPOSITORY" >> notes.md

      # Creates the release, or fills in the one already made from the website
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Ambilight.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Ambilight ${GITHUB_REF_NAME#v}" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" Ambilight.zip --title "Ambilight ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
